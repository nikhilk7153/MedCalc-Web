[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcalc-web"
version = "0.2.0"
description = "Medical Calculator Web Application"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.110,<0.112",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.csv"]

